<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Rainhas de Areia — diorama 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e2233;--mute:#8a8578;--line:#e1dacb;--card:#faf8f3;--green:#16301f;--yel:#ffd75a;--accent:#c2561f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f3efe8;overflow:hidden;font-family:'IBM Plex Mono',ui-monospace,monospace;color:var(--ink);-webkit-user-select:none;user-select:none;transition:background .6s;touch-action:none}
#c{position:fixed;inset:0;display:block;width:100vw;height:100vh;cursor:grab}#c:active{cursor:grabbing}
.ui{position:fixed}
button{font:inherit;cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;flex:none;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
/* title block */
#title{left:14px;top:14px;max-width:262px;padding:9px 11px 11px;background:rgba(243,239,232,.88);backdrop-filter:blur(4px);border:1px solid rgba(225,218,203,.7)}
#title .k{font-size:9px;letter-spacing:1.5px;color:var(--mute);text-transform:uppercase}
#title .cred{font-size:9px;letter-spacing:1.2px;color:var(--accent);margin-top:3px;font-weight:600;text-transform:uppercase}
#title h1{font-weight:700;font-size:24px;line-height:1.05;margin:6px 0 7px;letter-spacing:1.5px}
#title p{font-size:10.5px;line-height:1.5;margin:0;color:#4a4a4a}
.trow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--card)}
.seg button,.tb{font-weight:600;font-size:9px;letter-spacing:1px;border:0;background:none;color:var(--mute);padding:5px 9px}
.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--ink);color:#fff}
.tb{border:1px solid var(--line);background:var(--card);color:var(--ink)}.tb:hover{background:#fff}
body.dark #title{background:rgba(20,38,79,.72);border-color:rgba(255,255,255,.12)}body.dark #title,body.dark #title p{color:#d5d9e6}body.dark #title .cred{color:#ffb538}
/* scoreboard */
#sb{left:50%;top:14px;transform:translateX(-50%);background:var(--green);color:var(--yel);font-weight:500;padding:7px 10px 6px;min-width:262px;border:2px solid #0e1a12;box-shadow:0 2px 0 rgba(0,0,0,.15);pointer-events:none}
.sr{display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.5}.sr .sv{width:8px}.sr .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.sr .pt{min-width:26px;text-align:center;background:var(--yel);color:var(--green);font-weight:700;padding:0 3px}
.pp b{display:inline-block;width:7px;height:7px;border:1px solid #5e7a63;margin-left:2px}.pp b.on{background:var(--yel);border-color:var(--yel)}
.sl{font-size:9px;text-align:center;margin-top:4px;letter-spacing:.5px;color:#e6e9f0}.sl.dim{color:#8fae95;margin-top:1px}
/* panel */
#panel{right:14px;top:14px;width:258px;max-height:calc(100vh - 28px);overflow:auto;background:var(--card);border:1px solid var(--line);font-size:10px;scrollbar-width:thin}
#panel section{padding:9px 11px;border-bottom:1px solid var(--line)}#panel section:last-child{border:0}
#panel h3{margin:0 0 6px;font-size:8.5px;letter-spacing:1.6px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between}
.lr{display:flex;align-items:center;gap:7px;padding:4px 0;border-top:1px solid #efe9dc}.lr:first-child{border:0}
.lr .who{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}.lr .who b{font-weight:600;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr small{font-size:8.5px;color:var(--mute)}
.lr .rec{font-weight:600}.lr .tag{font-size:7.5px;letter-spacing:.6px;color:var(--mute);width:62px;text-align:right}.lr.on .tag{color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:4px}.btns button{flex:1 1 auto;border:1px solid var(--line);background:#fff;color:var(--ink);padding:5px 6px;font-size:9.5px}
.btns button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.btns .arrow{flex:0 0 34px;font-weight:700}
.chips{display:grid;border:1px solid var(--line);margin-bottom:5px}.chips.c4{grid-template-columns:repeat(4,1fr)}.chips.c3{grid-template-columns:repeat(3,1fr)}
.chips button{border:0;border-right:1px solid var(--line);background:none;padding:5px 0;color:var(--mute);font-size:9.5px}.chips button:last-child{border:0}
.chips button.cur{color:var(--ink);font-weight:600}.chips button.on{background:var(--ink);color:#fff}
.bar{height:4px;background:#ebe5d8;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--ink)}
.note{font-size:9px;color:var(--mute);margin:2px 0}
#playbox .btns{opacity:.75}#playbox.active .btns{opacity:1}#p-on.on{background:var(--accent);border-color:var(--accent)}
#p-hint{font-size:9px;color:var(--mute);line-height:1.45;margin:6px 0 2px}#p-status{font-size:9px;color:var(--accent);font-weight:600;min-height:12px}
#com p{margin:0 0 4px;line-height:1.45;font-size:10px}#com p.old{color:var(--mute)}
#b-panel{display:none}
#foot{left:14px;bottom:12px;font-size:9px;color:var(--mute);letter-spacing:.3px;pointer-events:none;max-width:60vw}
body.dark #foot{color:#bcc1d3}
#fps{right:14px;bottom:12px;font-size:10px;background:rgba(14,15,26,.75);color:#9fe8a0;padding:3px 7px;display:none;pointer-events:none}
/* menu + dialogs */
#menu,#dlg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f3efe8;z-index:20;padding:16px;overflow:auto;transition:opacity .5s}
#menu.gone{opacity:0;pointer-events:none}
#dlg{display:none;background:rgba(243,239,232,.82);backdrop-filter:blur(3px)}#dlg.open{display:flex}
.mcard{width:min(860px,100%);background:var(--card);border:1px solid var(--line);padding:24px 26px;box-shadow:0 10px 40px rgba(30,34,51,.08)}
.mcard.small{width:min(460px,100%)}.mcard.loading{text-align:center;width:auto;padding:30px 50px}.mcard.loading p{color:var(--mute);font-size:12px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mcard .k{font-size:10px;letter-spacing:1.6px;color:var(--mute);text-transform:uppercase}.mcard .cred{font-size:10px;letter-spacing:1.3px;color:var(--accent);font-weight:600;margin-top:4px;text-transform:uppercase}
.mcard h1{font-size:36px;letter-spacing:2px;margin:8px 0 0;line-height:1}.mcard h3{font-size:9.5px;letter-spacing:1.8px;color:var(--mute);margin:0 0 9px}
.mdesc{font-size:12px;line-height:1.6;color:#4a4a4a;margin:14px 0 18px;max-width:640px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.langsw{display:inline-flex;border:1px solid var(--line);flex:none}.langsw button{border:0;background:none;padding:6px 10px;font-weight:600;font-size:10px;color:var(--mute)}.langsw button.on{background:var(--ink);color:#fff}
.qopt{display:block;border:1px solid var(--line);padding:9px 11px;margin-bottom:7px;cursor:pointer;background:#fff;position:relative}.qopt input{position:absolute;opacity:0}
.qopt b{font-size:13px}.qopt em{font-style:normal;font-size:8.5px;letter-spacing:.8px;color:#fff;background:var(--accent);padding:2px 6px;margin-left:8px;vertical-align:2px}
.qopt span{display:block;font-size:10.5px;color:var(--mute);line-height:1.45;margin-top:3px}.qopt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pairrow{display:flex;align-items:center;gap:6px;margin-bottom:8px}.pairrow .pl{font-size:10px;color:var(--mute);width:52px}
.pairrow input{flex:1;min-width:0;font:500 13px 'IBM Plex Mono',monospace;border:1px solid var(--line);background:#fff;padding:7px 8px;color:var(--ink);-webkit-user-select:text;user-select:text}
.pairrow input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;font-size:10px;color:var(--mute)}
.go{background:var(--ink);color:#fff;border:0;padding:11px 20px;font-weight:600;font-size:13px;letter-spacing:1px}.go:hover{background:#000}
.ghost{background:none;border:1px solid var(--line);padding:10px 16px;font-weight:600}
@media (max-width:820px){
  .mcols{grid-template-columns:1fr}.mcard{padding:18px}.mcard h1{font-size:26px}.mfoot{flex-direction:column;align-items:stretch}.mfoot span{text-align:center}
  #title{left:8px;top:8px;max-width:calc(100vw - 16px);padding:6px 8px}#title p,#title .k{display:none}#title h1{font-size:16px;margin:2px 0 0}.trow{margin-top:6px}
  #sb{top:auto;bottom:calc(8px + env(safe-area-inset-bottom));left:8px;right:8px;transform:none;min-width:0}
  #b-panel{display:inline-block}#panel{display:none;top:auto;bottom:calc(98px + env(safe-area-inset-bottom));left:8px;right:8px;width:auto;max-height:52vh}#panel.open{display:block}
  #foot{display:none}#fps{bottom:auto;top:8px}
}
@media (max-width:900px) and (orientation:landscape) and (max-height:500px){#sb{width:270px;left:auto;right:8px}#panel{left:auto;width:290px;bottom:8px;top:8px;max-height:none}}
</style></head><body>
<canvas id="c"></canvas>
<div id="title" class="ui"><div class="k" id="kick"></div><div class="cred" id="cred"></div><h1 id="ttl"></h1><p id="desc"></p>
  <div class="trow"><span class="seg" id="lang"><button data-l="pt">PT-BR</button><button data-l="en">EN</button></span><button class="tb" id="b-team"></button><button class="tb" id="b-q"></button><button class="tb" id="b-panel"></button></div></div>
<div id="sb" class="ui"></div>
<div id="panel" class="ui">
  <section><h3><span id="h-lad"></span><span id="h-stays"></span></h3><div id="lad"></div></section>
  <section><h3 id="h-view"></h3><div class="btns"><button class="arrow" id="v-left">⟲</button><button id="v-follow"></button><button id="v-tour"></button><button class="arrow" id="v-right">⟳</button></div><div class="btns" style="margin-top:4px"><button id="v-tags"></button><button id="v-fps"></button><button id="v-reset"></button></div></section>
  <section><h3 id="h-wx"></h3><div id="wx"></div></section>
  <section id="playbox"><h3 id="h-play"></h3><div class="btns"><button id="p-on"></button></div><div class="btns" style="margin-top:4px"><button id="p-serve"></button><button id="p-spike"></button><button id="p-tip"></button></div><div id="p-hint"></div><div id="p-status"></div></section>
  <section><h3 id="h-com"></h3><div id="com"></div></section>
</div>
<div id="foot" class="ui"></div>
<div id="fps" class="ui"></div>
<div id="dlg"></div>
<div id="menu"></div>
