<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Side Out — beach volleyball diorama</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e2233;--mute:#8a8578;--line:#e1dacb;--card:#faf8f3;--green:#16301f;--yel:#ffd75a}
html,body{margin:0;height:100%;background:#f3efe8;overflow:hidden;font-family:'IBM Plex Mono',ui-monospace,monospace;color:var(--ink);-webkit-user-select:none;user-select:none;transition:background .6s}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#c{flex:none;display:block}
.ui{position:fixed;pointer-events:none}
#title{left:14px;top:14px;max-width:244px;padding:8px 10px 10px;background:rgba(243,239,232,.86);backdrop-filter:blur(3px)}
body.dark #title{background:rgba(20,38,79,.7)}
#title .k{font-size:9px;letter-spacing:1.5px;color:var(--mute);text-transform:uppercase}
#title h1{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:30px;line-height:1;margin:6px 0 8px;letter-spacing:2px}
#title p{font-size:11px;line-height:1.5;margin:0;color:#4a4a4a}
#title .cred{font-size:9px;letter-spacing:1.2px;color:#c2561f;margin-top:3px;font-weight:600;text-transform:uppercase}
#lang{display:inline-flex;margin-top:10px;border:1px solid var(--line);background:var(--card);pointer-events:auto}
#lang button{font:600 9px 'IBM Plex Mono',monospace;letter-spacing:1px;border:0;background:none;color:var(--mute);padding:5px 9px;cursor:pointer}
#lang button+button{border-left:1px solid var(--line)}#lang button.on{background:var(--ink);color:#fff}
body.dark #title .cred{color:#ffb538}
#sb{left:50%;top:18px;transform:translateX(-50%);background:var(--green);color:var(--yel);font-family:'IBM Plex Mono',monospace;font-weight:500;padding:7px 10px 6px;min-width:250px;border:2px solid #0e1a12;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.sr{display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.5}
.sr .sv{width:8px;color:var(--yel)}.sr .nm{flex:1;white-space:nowrap}
.sr .pt{min-width:24px;text-align:center;background:var(--yel);color:var(--green);font-weight:700;padding:0 3px}
.pp b{display:inline-block;width:7px;height:7px;border:1px solid #5e7a63;margin-left:2px}.pp b.on{background:var(--yel);border-color:var(--yel)}
.sl{font-size:9px;text-align:center;margin-top:4px;letter-spacing:.5px;color:#e6e9f0}.sl.dim{color:#8fae95;margin-top:1px}
.dot{display:inline-block;width:9px;height:9px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
#panel{right:18px;top:18px;width:236px;background:var(--card);border:1px solid var(--line);font-size:10px}
#panel section{padding:9px 11px;border-bottom:1px solid var(--line)}#panel section:last-child{border:0}
#panel h3{margin:0 0 6px;font-size:8.5px;letter-spacing:1.6px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between}
.lr{display:flex;align-items:center;gap:7px;padding:4px 0;border-top:1px solid #efe9dc}.lr:first-child{border:0}
.lr .who{flex:1;display:flex;flex-direction:column;line-height:1.25}.lr .who b{font-weight:600;font-size:10.5px}.lr small{font-size:8.5px;color:var(--mute)}
.lr .rec{font-weight:600}.lr .tag{font-size:7.5px;letter-spacing:.8px;color:var(--mute);width:48px;text-align:right}.lr.on .tag{color:#c2561f}
.kv{display:flex;justify-content:space-between;padding:2px 0}.kv span{color:var(--mute)}.kv b{font-weight:600}
.note{font-size:9px;color:var(--mute);margin:1px 0 4px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin-bottom:5px}.chips span{text-align:center;padding:4px 0;border-right:1px solid var(--line);color:var(--mute)}.chips span:last-child{border:0}
.chips:nth-child(2){grid-template-columns:repeat(2,1fr)}
.chips span.on{background:var(--ink);color:#fff}
.bar{height:4px;background:#ebe5d8;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--ink)}
#com p{margin:0 0 4px;line-height:1.45;font-size:10px}#com p.old{color:var(--mute)}
#foot{left:22px;bottom:16px;font-size:9px;color:var(--mute);letter-spacing:.4px}
body.dark #title,body.dark #foot{color:#bcc1d3}body.dark #title p{color:#bcc1d3}body.dark #title .k{color:#8c93ad}
@media (max-width:820px){
  #title{left:12px;top:10px}#title p,#title .k{display:none}#title h1{font-size:20px;margin:2px 0 0}#lang{margin-top:6px}
  #sb{top:auto;bottom:calc(10px + env(safe-area-inset-bottom));min-width:0;width:calc(100% - 24px);box-sizing:border-box;left:12px;transform:none}
  #panel{top:10px;right:10px;width:180px}#panel section.opt{display:none}#panel section{padding:6px 8px}.lr small{display:none}
  #foot{display:none}
}
@media (max-width:820px) and (orientation:landscape){#sb{width:260px;left:auto;right:10px;bottom:10px}#panel{display:none}}
</style></head><body>

<div id="foot" class="ui"></div>
